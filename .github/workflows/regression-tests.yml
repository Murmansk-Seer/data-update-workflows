name: Resource pipeline regression tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m unittest discover -s tests -q
      - run: uv run ruff check scripts/seer_unity_assets/update.py scripts/seer_unity_assets/chip_recovery.py tests/test_chip_recovery.py tests/test_seer_unity_assets_update.py
      - run: uv run ruff format --check scripts/seer_unity_assets/update.py scripts/seer_unity_assets/chip_recovery.py tests/test_chip_recovery.py tests/test_seer_unity_assets_update.py
