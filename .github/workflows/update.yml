name: Data repository update pipeline

on:
  schedule:
    - cron: "0,30 * * * *"

  workflow_dispatch:
    inputs:
      force-update-assets:
        type: boolean
        description: "Force seer-unity-assets update (ConfigPackage, DefaultPackage)"
        required: false
        default: false
      force-update-pet-assets:
        type: boolean
        description: "Force pet animation assets update (PetAnimPackage)"
        required: false
        default: false
      force-update-config:
        type: boolean
        description: "Force config-sources update"
        required: false
        default: false
      dispatch-api-data:
        type: boolean
        description: "Dispatch api-data after config-sources changes"
        required: false
        default: true

concurrency:
  group: data-update-workflows
  cancel-in-progress: false

env:
  UNITY_ASSETS_REPO: "Murmansk-Seer/seer-unity-assets"
  PET_ANIM_REPO: "Murmansk-Seer/seer-unity-assets-pet_anim_part"
  CONFIG_SOURCE_REPO: "Murmansk-Seer/config-sources"
  TQDM_MININTERVAL: 5

permissions:
  actions: write
  contents: write

jobs:
  check-unity-assets:
    runs-on: ubuntu-latest
    outputs:
      need_update_main: ${{ steps.check-update.outputs.need_update_main }}
      need_update_pet: ${{ steps.check-update.outputs.need_update_pet }}

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 6

      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.10"
          install-dependencies: "true"

      - name: Check asset versions
        id: check-update
        run: uv run check-seer-assets main

  update-main-assets:
    runs-on: ubuntu-latest
    needs: check-unity-assets
    if: ${{ needs.check-unity-assets.outputs.need_update_main == 'true' || inputs.force-update-assets }}
    outputs:
      has_update: ${{ steps.update-main.outputs.has_update }}

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.10"
          install-dependencies: "true"

      - name: Check cross-repository token
        env:
          CROSS_REPO_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ -z "${CROSS_REPO_TOKEN}" ]; then
            echo "::error::Missing PAT secret; cannot update ${UNITY_ASSETS_REPO}"
            exit 1
          fi

      - name: Check out seer-unity-assets
        uses: ./.github/actions/checkout-repo
        with:
          repository: ${{ env.UNITY_ASSETS_REPO }}
          path: "seer-unity-assets"
          token: ${{ secrets.PAT }}
          fetch-depth: 1

      - name: Update seer-unity-assets
        id: update-main
        working-directory: seer-unity-assets
        run: |
          uv run update-seer-assets \
            --repo-path . \
            --packages ConfigPackage,DefaultPackage \
            ${{ inputs.force-update-assets && '--force' || '' }}

  update-pet-assets:
    runs-on: ubuntu-latest
    needs: check-unity-assets
    if: ${{ needs.check-unity-assets.outputs.need_update_pet == 'true' || inputs.force-update-pet-assets }}
    outputs:
      has_update: ${{ steps.update-pet.outputs.has_update }}

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.10"
          install-dependencies: "true"

      - name: Check cross-repository token
        env:
          CROSS_REPO_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ -z "${CROSS_REPO_TOKEN}" ]; then
            echo "::error::Missing PAT secret; cannot update ${PET_ANIM_REPO}"
            exit 1
          fi

      - name: Check out pet animation assets
        uses: ./.github/actions/checkout-repo
        with:
          repository: ${{ env.PET_ANIM_REPO }}
          path: "seer-unity-assets-pet_anim_part"
          token: ${{ secrets.PAT }}
          fetch-depth: 1
          init-if-empty: "true"

      - name: Update pet animation assets
        id: update-pet
        working-directory: seer-unity-assets-pet_anim_part
        run: |
          uv run update-seer-assets \
            --repo-path . \
            --packages PetAnimPackage \
            ${{ inputs.force-update-pet-assets && '--force' || '' }}

  update-config-sources:
    runs-on: ubuntu-latest
    needs:
      - check-unity-assets
      - update-main-assets
      - update-pet-assets
    if: >-
      ${{ always() &&
          needs.check-unity-assets.result == 'success' &&
          (needs.update-main-assets.result == 'success' || needs.update-main-assets.result == 'skipped') &&
          (needs.update-pet-assets.result == 'success' || needs.update-pet-assets.result == 'skipped') &&
          (needs.update-main-assets.outputs.has_update == 'true' ||
           needs.update-pet-assets.outputs.has_update == 'true' ||
           inputs.force-update-config) }}

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.10"
          install-dependencies: "true"

      - name: Check cross-repository token
        env:
          CROSS_REPO_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ -z "${CROSS_REPO_TOKEN}" ]; then
            echo "::error::Missing PAT secret; cannot update ${CONFIG_SOURCE_REPO}"
            exit 1
          fi

      - name: Check out config-sources
        id: checkout-repo
        uses: ./.github/actions/checkout-repo
        with:
          repository: ${{ env.CONFIG_SOURCE_REPO }}
          path: "config-sources"
          token: ${{ secrets.PAT }}
          fetch-depth: 1

      - name: Update config-sources
        id: update
        working-directory: ${{ steps.checkout-repo.outputs.repo-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: uv run update-config-sources ${{ inputs.force-update-config && '--force' || '' }}

      - name: Dispatch api-data build
        uses: peter-evans/repository-dispatch@v4
        if: >-
          steps.update.outputs.has_update == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dispatch-api-data)
        with:
          token: ${{ secrets.PAT }}
          repository: Murmansk-Seer/api-data
          event-type: config-source-update
