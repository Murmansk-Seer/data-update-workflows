[project]
name = "scripts"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "UnityPy>=1.24.2",
    "albi0>=0.6.1",
    "gitpython>=3.1.45",
    "pytz>=2025.2",
    "seerapi-solaris",
    "seerapi-models>=106.12.0",
    "xmltodict>=1.0.2",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.2",
    "ruff>=0.12.0",
]

[tool.uv]
package = true

[tool.uv.sources]
albi0 = { git = "https://github.com/Murmansk-Seer/albi0.git", rev = "530c6d802a906fb2f5c890de782e770223334ee5" }
seerapi-solaris = { git = "https://github.com/Murmansk-Seer/seerapi.git", rev = "3df3db546a36d1bed6e31fbdf3a2d5f514c3ff8e", subdirectory = "packages/solaris" }
seerapi-models = { git = "https://github.com/Murmansk-Seer/seerapi.git", rev = "3df3db546a36d1bed6e31fbdf3a2d5f514c3ff8e", subdirectory = "packages/seerapi-models" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project.scripts]
check-seer-assets = "scripts.seer_unity_assets.check:main"
update-seer-assets = "scripts.seer_unity_assets.update:main"
update-config-sources = "scripts.config_sources.update:main"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true
