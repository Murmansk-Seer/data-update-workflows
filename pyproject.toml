[project]
name = "scripts"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "UnityPy>=1.24.2",
    "albi0>=0.6.0",
    "gitpython>=3.1.45",
    "pytz>=2025.2",
    "seerapi-solaris",
    "seerapi-models>=106.12.0",
    "xmltodict>=1.0.2",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.2",
    "ruff>=0.12.0",
]

[tool.uv]
package = true

[tool.uv.sources]
albi0 = { git = "https://github.com/Murmansk-Seer/albi0.git", rev = "d4a7b113ddb61c4e224204d2f95dc141cfd4dc49" }
seerapi-solaris = { git = "https://github.com/Murmansk-Seer/seerapi.git", rev = "70365b899963258971655071fd7f6ea8d834a645", subdirectory = "packages/solaris" }
seerapi-models = { git = "https://github.com/Murmansk-Seer/seerapi.git", rev = "70365b899963258971655071fd7f6ea8d834a645", subdirectory = "packages/seerapi-models" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project.scripts]
check-seer-assets = "scripts.seer_unity_assets.check:main"
update-seer-assets = "scripts.seer_unity_assets.update:main"
update-config-sources = "scripts.config_sources.update:main"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
reportShadowedImports = false
disableBytesTypePromotions = true
